version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  groups:
    minor-and-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  groups:
    minor-and-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
- package-ecosystem: pre-commit
  directory: "/"
  schedule:
    interval: weekly
