# Site settings
title: "TripleA: An Open Source Turn Based Grand Strategy Game"
description: TripleA is a free open source turn based grand strategy game engine with play similar to Axis & Allies and Risk. Over three hundred different maps created by the community covering a wide variety of scenarios (such as WW1, WW2 and various science fiction and fantasy worlds) are available for download. TripleA supports single player vs AI, hot-seat, play by email and forum, direct online play, and a hosted lobby for live online play with other community members.
url: "https://triplea-game.org"
markdown: kramdown
sass:
  style: compressed
  sourcemap: never

collections:
  maps:
    output: true
    permalink: /map/:path/

defaults:
  - scope:
      path: ""
    values:
      image: /images/triplea_promo.png
  - scope:
      path: ""
      type: maps
    values:
      layout: map

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
